
[platformio]
default_envs = temperatura

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

lib_deps =
    marcoschwartz/LiquidCrystal_I2C
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    claws/BH1750
    makuna/Rtc

[env:blink]
build_src_filter = +<blink.cpp>

[env:humedad]
build_src_filter = +<humedad.cpp>

[env:bomba]
build_src_filter = +<bomba.cpp>

[env:temperatura]
build_src_filter = +<temp.cpp>

[env:reloj]
build_src_filter = +<tempo.cpp>

[env:luminosidad]
build_src_filter = +<luz.cpp>

[env:R_automatico]
build_src_filter = +<Riego.cpp>

[env:Alertass]
build_src_filter = +<alertas.cpp>

[env:plantcare]
build_src_filter = +<main.cpp>
